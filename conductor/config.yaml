agents:
  - id: jira-yassir
    type: jira
    profile: yassir
    url: http://jira-yassir:8000
    port: 20001

  - id: github-yassir
    type: github
    profile: yassir
    url: http://github-yassir:8000
    port: 20011

  # Uncomment as you add more agents:
  # - id: jira-zeal
  #   type: jira
  #   profile: zeal
  #   url: http://jira-zeal:8000
  #   port: 20000
  #
