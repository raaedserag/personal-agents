  #
  # - id: infra-zeal
  #   type: infra
  #   profile: zeal
  #   url: http://infra-zeal:8000
  #   port: 20040

schedules:
  morning_briefing:
    cron: "0 7 * * 1-5"
    action: planner.morning_briefing
    deliver_to: [dashboard]

  blocker_check:
    cron: "0 */3 * * 1-5"
    action: planner.blocker_alert
    deliver_to: [dashboard]

  pr_digest:
    cron: "0 9,14 * * 1-5"
    action: planner.pr_digest
    deliver_to: [dashboard]

  eod_summary:
    cron: "0 18 * * 1-5"
    action: planner.eod_summary
    deliver_to: [dashboard]
