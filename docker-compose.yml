services:
  # ─── Conductor (API Gateway + Orchestrator) ────────────────────
  conductor:
    build:
      context: .
      dockerfile: conductor/Dockerfile
    container_name: nc-conductor
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - secrets/shared.env
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY}
      - DASHBOARD_PIN=${DASHBOARD_PIN:-1234}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Jira Agent: Yassir (IC scope) ────────────────────────────
  jira-yassir:
    build:
      context: .
      dockerfile: agents/jira-agent/Dockerfile
    container_name: nc-jira-yassir
    restart: unless-stopped
    ports:
      - "20001:8000"
    env_file:
      - secrets/yassir.env
      - secrets/shared.env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PROFILE_ID=yassir
      - PROFILE_SCOPE=individual
      - JIRA_DOMAIN=${YASSIR_JIRA_DOMAIN}
      - JIRA_EMAIL=${YASSIR_JIRA_EMAIL}
      - JIRA_API_TOKEN=${YASSIR_JIRA_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - memory_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

