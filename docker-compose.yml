  #   restart: unless-stopped
  #   ports:
  #     - "20000:8000"
  #   env_file:
  #     - secrets/zeal.env
  #     - secrets/shared.env
  #   environment:
  #     - OLLAMA_BASE_URL=http://ollama:11434
  #     - PROFILE_ID=zeal
  #     - PROFILE_SCOPE=leader
  #     - JIRA_DOMAIN=${ZEAL_JIRA_DOMAIN}
  #     - JIRA_EMAIL=${ZEAL_JIRA_EMAIL}
  #     - JIRA_API_TOKEN=${ZEAL_JIRA_TOKEN}
  #   volumes:
  #     - memory_data:/app/data
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
  #     interval: 10s
