spec_version: "0.2.0"
name: nerve-gmail-agent
version: 1.0.0
description: >
  Read-only Gmail agent for the Nerve Center platform.
  Surfaces unread important emails and threads needing action.

model:
  default:
    provider: ollama
    name: llama3.2
    base_url: http://host.docker.internal:11434

skills:
  - gmail_fetcher

secrets:
  - GOOGLE_CLIENT_ID
  - GOOGLE_CLIENT_SECRET
  - AGENT_API_KEY
