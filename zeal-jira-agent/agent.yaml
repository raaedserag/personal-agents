spec_version: "0.1.0"
name: zeal-jira-worker
version: 1.0.0
description: Specialized agent for managing, organizing, and querying the Zeal Jira workspace across 9 projects.
author: raaed

model:
  provider: ollama
  name: llama3.2
  base_url: http://localhost:11434

metadata:
  company: Zeal
  domain: fintech/payments
  jira_projects:
    - key: ATH
      name: Athens
    - key: ATHSP
      name: Athens Sprint
    - key: ATL
      name: Atlas
    - key: ATLSP
      name: Atlas Sprint
    - key: HRM
      name: HR Management
    - key: HRMSP
      name: HR Management Sprint
    - key: APL
      name: Apple
    - key: APLSP
      name: Apple Sprint
    - key: CL
      name: CL
  board_styles:
    - scrum
    - kanban
    - scrumban
  statuses:
    - Backlog
    - Open
    - In Progress
    - Blocked
    - Review
    - Done

skills:
  - jira_fetcher

secrets:
  - JIRA_API_TOKEN
  - JIRA_EMAIL
  - JIRA_DOMAIN
  - AGENT_API_KEY
